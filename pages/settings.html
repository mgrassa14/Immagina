<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title data-i18n="settingsTitle">Impostazioni — Immagina</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header>
    <h1 data-i18n="settingsHeading">Impostazioni</h1>
  </header>

  <main>
    <section aria-labelledby="settings-title">
      <h2 id="settings-title" data-i18n="preferencesHeading">Preferenze</h2>
      <div class="settings-control">
        <label for="speech-rate" data-i18n="speechRateLabel">Velocità della voce italiana</label>
        <input id="speech-rate" type="range" min="0.6" max="1.4" step="0.1" value="1">
        <output id="speech-rate-value" for="speech-rate">1.0×</output>
      </div>
      <div class="settings-control">
        <label for="appearance" data-i18n="appearanceLabel">Aspetto</label>
        <select id="appearance">
          <option value="system" data-i18n="appearanceSystem">Come il dispositivo</option>
          <option value="light" data-i18n="appearanceLight">Chiaro</option>
          <option value="dark" data-i18n="appearanceDark">Scuro</option>
        </select>
      </div>
      <p id="settings-status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navigazione" data-i18n-aria-label="navigationLabel">
    <a href="../index.html" data-i18n="homeLink">Home</a>
    <a href="../pages/settings.html" aria-current="page" data-i18n="settingsLink">Impostazioni</a>
    <button id="language-toggle" type="button">English</button>
  </nav>

  <script src="../js/preferences.js"></script>
  <script src="../js/language.js"></script>
  <script src="../js/settings.js"></script>
</body>
</html>
