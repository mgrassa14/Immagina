<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Impostazioni — Immagina</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header>
    <h1>Impostazioni</h1>
    <nav aria-label="Navigazione principale">
      <a class="settings-link" href="index.html">Torna all'app</a>
    </nav>
  </header>

  <main>
    <section aria-labelledby="settings-title">
      <h2 id="settings-title">Preferenze</h2>
      <div class="settings-control">
        <label for="speech-rate">Velocità della voce italiana</label>
        <input id="speech-rate" type="range" min="0.6" max="1.4" step="0.1" value="1">
        <output id="speech-rate-value" for="speech-rate">1.0×</output>
      </div>
      <div class="settings-control">
        <label for="appearance">Aspetto</label>
        <select id="appearance">
          <option value="system">Come il dispositivo</option>
          <option value="light">Chiaro</option>
          <option value="dark">Scuro</option>
        </select>
      </div>
      <p id="settings-status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="../js/preferences.js"></script>
  <script src="../js/settings.js"></script>
</body>
</html>
